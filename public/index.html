<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard CRUD</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <span class="subtitle">DASHBOARD ADMIN</span>
          <h1>Gestão de Utilizadores</h1>
        </div>

        <button id="openModalBtn">Novo Utilizador</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>DATA</th>
            <th>NOME</th>
            <th>EMAIL</th>
            <th>STATUS</th>
            <th>AÇÕES</th>
          </tr>
        </thead>

        <tbody id="userTableBody"></tbody>
      </table>
    </div>

    <div id="userModal" class="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Novo Utilizador</h2>

        <form id="userForm">
          <input type="text" id="name" placeholder="Nome" required />
          <input type="email" id="email" placeholder="Email" required />

          <div class="modal-actions">
            <button type="button" id="closeModalBtn" class="btn-secondary">
              Cancelar
            </button>

            <button type="submit" id="saveButton" class="btn-primary">
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="deleteModal" class="modal">
      <div class="modal-content delete-modal">
        <h2>Excluir Utilizador</h2>

        <p>Tem certeza que deseja excluir este utilizador?</p>

        <div class="modal-actions">
          <button id="cancelDeleteBtn" class="btn-secondary">Cancelar</button>

          <button id="confirmDeleteBtn" class="btn-delete">Excluir</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
