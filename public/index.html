<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRUD Moderno</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>🚀 Gestão de Utilizadores</h1>

    <form id="userForm">

      <input
        type="text"
        id="name"
        placeholder="Nome"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <button type="submit">

        Salvar Utilizador

      </button>

    </form>

    <div id="userList"></div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>

</body>

</html>
